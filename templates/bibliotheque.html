<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ma Bibliothèque</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f7f6; margin: 0; padding: 40px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #3498db; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        tr:hover { background-color: #f1f1f1; }
        .badge { padding: 5px 10px; border-radius: 15px; font-size: 0.8em; font-weight: bold; }
        .dispo { background-color: #27ae60; color: white; }
        .emprunte { background-color: #e74c3c; color: white; }
        .btn { text-decoration: none; background: #34495e; color: white; padding: 6px 12px; border-radius: 4px; font-size: 0.9em; }
        .btn:hover { background: #2c3e50; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Ma Bibliothèque Numérique</h1>
        <table>
            <thead>
                <tr>
                    <th>Titre</th>
                    <th>Auteur</th>
                    <th>Statut</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for livre in livres %}
                <tr>
                    <td><strong>{{ livre.titre }}</strong></td>
                    <td>{{ livre.auteur }}</td>
                    <td>
                        {% if livre.disponible %}
                            <span class="badge dispo">Disponible</span>
                        {% else %}
                            <span class="badge emprunte">Emprunté</span>
                        {% endif %}
                    </td>
                    <td>
                        {% if livre.disponible %}
                            <a href="/emprunter/{{ livre.id }}" class="btn">Emprunter</a>
                        {% else %}
                            <span style="color: #95a5a6; font-style: italic;">Indisponible</span>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
